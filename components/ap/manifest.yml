vars:
  component: harmony-ap

inputs:
  # Tomcat
  - from: vendor:tomcat
    do: unpack
    strip: 1
    exclude:
      - "webapps/**"
      - "**/*.bat"
      - "**/*.txt"
      - "**/*.md"
    into: .
    routes:
      - include:
          - "bin/*.sh"
          - "bin/*.jar"
        into: /usr/lib/harmony-ap/tomcat/bin
      - include:
          - "lib/**"
        into: /usr/lib/harmony-ap/tomcat/lib
      - include:
          - "conf/web.xml"
          - "conf/catalina.properties"
        into: /usr/lib/harmony-ap/tomcat/conf

  # Liquibase
  - from: vendor:liquibase
    do: unpack
    include:
      - "liquibase"
      - "internal/lib/commons-collections4.jar"
      - "internal/lib/commons-io.jar"
      - "internal/lib/commons-lang3.jar"
      - "internal/lib/commons-text.jar"
      - "internal/lib/h2.jar"
      - "internal/lib/liquibase-core.jar"
      - "internal/lib/opencsv.jar"
      - "internal/lib/picocli.jar"
      - "internal/lib/snakeyaml.jar"
    into: /usr/lib/harmony-ap/liquibase

  # JDBC drivers
  - from: vendor:mysqlj
    do: copy
    into: /usr/lib/harmony-ap/tomcat/lib/mysql-connector-j.jar
  - from: vendor:mariadbj
    do: copy
    into: /usr/lib/harmony-ap/tomcat/lib/mariadb-java-client.jar

  # s6-overlay
  - from: vendor:s6overlay:noarch
    do: copy
    into: /vendor-archives/s6-overlay-noarch.tar.xz
    when: { scopes: [docker] }
  - from: vendor:s6overlay:amd64
    do: copy
    into: /vendor-archives/s6-overlay-amd64.tar.xz
    when: { scopes: [docker] }
  - from: vendor:s6overlay:arm64
    do: copy
    into: /vendor-archives/s6-overlay-arm64.tar.xz
    when: { scopes: [docker] }

  # Application
  - from: artifact:war
    do: unpack
    strip: 0
    into: /usr/lib/harmony-ap/webapps/ROOT/

  # WS plugin
  - from: artifact:ws-plugin
    do: copy
    into: /usr/share/harmony-ap/plugins/lib/ws-plugin.jar

  # Shared libraries
  - from: project:components/shared/overlays/common
    do: copy
    into: /
  - from: project:components/shared/overlays/deb
    do: copy
    into: /
    when: { scopes: [deb] }

  # Overlays
  - from: project:components/ap/overlays/common
    do: copy
    into: /
  - from: project:components/ap/overlays/deb
    do: copy
    into: /
    when: { scopes: [deb] }
  - from: project:components/ap/overlays/docker
    do: copy
    into: /
    when: { scopes: [docker] }

  # Deb
  - from: project:components/ap/packaging/deb/generic
    do: copy
    into: /deb
    when: { scopes: [deb] }

  # Docker
  - from: project:components/ap/packaging/docker
    do: copy
    into: /
    when: { scopes: [docker] }

  # Changelog
  - from: project:CHANGELOG.md
    do: copy
    into: /usr/share/doc/harmony-ap/CHANGELOG.md
    when: { scopes: [deb, docker] }
