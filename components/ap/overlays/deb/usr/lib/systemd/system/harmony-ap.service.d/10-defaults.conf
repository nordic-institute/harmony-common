[Service]
# Harmony AP package defaults
# Managed by the harmony-ap package, may be overwritten on upgrade.
# For custom overrides use /etc/systemd/system/harmony-ap.service.d/90-override.conf
# then run: systemctl daemon-reload

# AP general paths
Environment=HARMONY_CONFIG=/etc/harmony-ap
Environment=HARMONY_ADDONS=/usr/local/lib/harmony-ap

# Database connection
Environment=DOMIBUS_DATABASE_SERVERNAME=localhost
Environment=DOMIBUS_DATABASE_PORT=3306
Environment=DOMIBUS_DATABASE_SCHEMA=harmony_ap
Environment=DOMIBUS_DATASOURCE_USER=harmony_ap
Environment=DOMIBUS_DATASOURCE_DRIVERCLASSNAME=com.mysql.cj.jdbc.Driver
Environment=DOMIBUS_HIBERNATE_DIALECT=org.hibernate.dialect.MySQL8Dialect

# Dynamic discovery
Environment=DOMIBUS_DYNAMICDISCOVERY_USEDYNAMICDISCOVERY=false
Environment=DOMIBUS_SMLZONE=

# AP identity and security stores
Environment=DOMIBUS_SECURITY_KEY_PRIVATE_ALIAS=selfsigned
Environment=DOMIBUS_SECURITY_KEYSTORE_LOCATION=/var/lib/harmony-ap/security/ap-keystore.p12
Environment=DOMIBUS_SECURITY_KEYSTORE_TYPE=pkcs12
Environment=DOMIBUS_SECURITY_TRUSTSTORE_LOCATION=/var/lib/harmony-ap/security/ap-truststore.p12
Environment=DOMIBUS_SECURITY_TRUSTSTORE_TYPE=pkcs12

# TLS stores
Environment=TLS_SOCKET_PROTOCOL=TLSv1.2
Environment=TLS_KEYSTORE_PATH=/var/lib/harmony-ap/security/tls-keystore.p12
Environment=TLS_KEYSTORE_TYPE=pkcs12
Environment=TLS_TRUSTSTORE_PATH=/var/lib/harmony-ap/security/tls-truststore.p12
Environment=TLS_TRUSTSTORE_TYPE=pkcs12

# Logback
Environment=LOGBACK_CONFIG_FILE=/etc/harmony-ap/logback.xml

# ActiveMQ broker
Environment=ACTIVEMQ_WORK_DIR=/var/lib/harmony-ap/broker
Environment=ACTIVEMQ_JMX_ACTIVE=true
Environment=ACTIVEMQ_EMBEDDED_CONFIGURATIONFILE=file:///etc/harmony-ap/activemq.xml

# Tomcat server
Environment=TOMCAT_PORT=8443
Environment=TOMCAT_SSL_ENABLED=true
Environment=TOMCAT_SCHEME=https
Environment=TOMCAT_SECURE=true
Environment=TOMCAT_WORK_DIR=/var/lib/harmony-ap/tomcat/work
Environment=TOMCAT_ACCESS_LOG_DIR=/var/log/harmony-ap

# Security
Environment=DOMIBUS_UI_SESSION_SECURE=true
Environment=DOMIBUS_AUTH_UNSECURELOGINALLOWED=false
Environment=DOMIBUS_PASSWORDPOLICY_DEFAULTUSER_CREATE=false

# JVM memory and garbage collection
Environment="CATALINA_OPTS=-Xms256M -Xmx512M -server -XX:+UseParallelGC"

# Java runtime options
Environment="JAVA_OPTS=-Djava.awt.headless=true -Djava.security.egd=file:/dev/urandom"
