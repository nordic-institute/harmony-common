[Service]
# Harmony SMP package defaults
# Managed by the harmony-smp package, may be overwritten on upgrade.
# For custom overrides use /etc/systemd/system/harmony-smp.service.d/90-override.conf
# then run: systemctl daemon-reload

# SMP general paths
Environment=SMP_SECURITY_FOLDER=/var/lib/harmony-smp/security
Environment=SMP_LOCALE_FOLDER=/var/lib/harmony-smp/locales
Environment=SMP_CONFIGURATION_FILE=/etc/harmony-smp/smp.config.properties
Environment=SMP_LIBRARIES_FOLDER=/usr/local/lib/harmony-smp/extensions/lib

# Database connection
Environment=SMP_DATABASE_SERVERNAME=localhost
Environment=SMP_DATABASE_PORT=3306
Environment=SMP_DATABASE_SCHEMA=harmony_smp
Environment=SMP_JDBC_USER=harmony_smp
Environment=SMP_JDBC_DRIVER=com.mysql.cj.jdbc.Driver
Environment=SMP_DATASOURCE_JNDI=java:comp/env/jdbc/harmony-smp

# SML
Environment=BDMSL_INTEGRATION_ENABLED=false

# SMP signing stores
Environment=SMP_KEYSTORE_PATH=/var/lib/harmony-smp/security/smp-keystore.p12
Environment=SMP_KEYSTORE_TYPE=pkcs12
Environment=SMP_TRUSTSTORE_PATH=/var/lib/harmony-smp/security/smp-truststore.p12
Environment=SMP_TRUSTSTORE_TYPE=pkcs12

# TLS stores
Environment=TLS_KEYSTORE_PATH=/var/lib/harmony-smp/security/tls-keystore.p12
Environment=TLS_KEYSTORE_TYPE=pkcs12
Environment=TLS_TRUSTSTORE_PATH=/var/lib/harmony-smp/security/tls-truststore.p12
Environment=TLS_TRUSTSTORE_TYPE=pkcs12

# Logback
Environment=SMP_LOG_CONFIGURATION_FILE=/etc/harmony-smp/logback.xml

# Tomcat server
Environment=TOMCAT_PORT=8443
Environment=TOMCAT_SSL_ENABLED=true
Environment=TOMCAT_SCHEME=https
Environment=TOMCAT_SECURE=true
Environment=TOMCAT_WORK_DIR=/var/lib/harmony-smp/tomcat/work
Environment=TOMCAT_ACCESS_LOG_DIR=/var/log/harmony-smp

# Security
Environment=SMP_UI_SESSION_SECURE=true
Environment="SMP_HTTP_HEADER_SECURITY_POLICY=default-src 'self'; script-src 'self'; connect-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; frame-ancestors 'none'; form-action 'self'; font-src 'self' data:; object-src 'none'; base-uri 'self'"

# JVM memory and garbage collection
Environment="CATALINA_OPTS=-Xms256M -Xmx512M -server -XX:+UseParallelGC"

# Java runtime options
Environment="JAVA_OPTS=-Djava.awt.headless=true -Djava.security.egd=file:/dev/urandom"
