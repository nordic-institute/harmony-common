vars:
  component: harmony-smp

inputs:
  # Tomcat
  - from: vendor:tomcat
    do: unpack
    strip: 1
    exclude:
      - "webapps/**"
      - "**/*.bat"
      - "**/*.txt"
      - "**/*.md"
    into: .
    routes:
      - include:
          - "bin/*.sh"
          - "bin/*.jar"
        into: /usr/lib/harmony-smp/tomcat/bin
      - include:
          - "lib/**"
        into: /usr/lib/harmony-smp/tomcat/lib
      - include:
          - "conf/web.xml"
          - "conf/catalina.properties"
        into: /usr/lib/harmony-smp/tomcat/conf

  # Liquibase
  - from: vendor:liquibase
    do: unpack
    include:
      - "liquibase"
      - "internal/lib/commons-collections4.jar"
      - "internal/lib/commons-io.jar"
      - "internal/lib/commons-lang3.jar"
      - "internal/lib/commons-text.jar"
      - "internal/lib/h2.jar"
      - "internal/lib/liquibase-core.jar"
      - "internal/lib/opencsv.jar"
      - "internal/lib/picocli.jar"
      - "internal/lib/snakeyaml.jar"
    into: /usr/lib/harmony-smp/liquibase

  # JDBC drivers (into tomcat/lib for JNDI classpath)
  - from: vendor:mysqlj
    do: copy
    into: /usr/lib/harmony-smp/tomcat/lib/mysql-connector-j.jar
  - from: vendor:mariadbj
    do: copy
    into: /usr/lib/harmony-smp/tomcat/lib/mariadb-java-client.jar

  # Application
  - from: artifact:war
    do: unpack
    strip: 0
    into: /usr/lib/harmony-smp/webapps/ROOT/

  # Shared libraries
  - from: project:components/shared/overlays/common
    do: copy
    into: /
  - from: project:components/shared/overlays/deb
    do: copy
    into: /
    when: { scopes: [deb] }

  # Overlays
  - from: project:components/smp/overlays/common
    do: copy
    into: /
  - from: project:components/smp/overlays/deb
    do: copy
    into: /
    when: { scopes: [deb] }

  # Deb
  - from: project:components/smp/packaging/deb/generic
    do: copy
    into: /deb
    when: { scopes: [ deb ] }

  # Changelog
  - from: project:CHANGELOG.md
    do: copy
    into: /usr/share/doc/harmony-smp/CHANGELOG.md
    when: { scopes: [deb] }
