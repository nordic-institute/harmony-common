name: Build deb builder image

on:
  push:
    branches:
      - develop
    paths:
      - build-logic/src/main/resources/docker/deb-builder/Dockerfile
      - .github/workflows/deb-builder-image.yml
  schedule:
    - cron: '0 4 * * 0'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/harmony-deb-builder
  DOCKERFILE_PATH: build-logic/src/main/resources/docker/deb-builder/Dockerfile
  BASE_IMAGE: ubuntu:24.04

jobs:
  guard:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.detect.outputs.should_build }}
      base_tag: ${{ steps.detect.outputs.base_tag }}
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Detect base image changes
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          BASE_DIGEST="$(docker buildx imagetools inspect "${BASE_IMAGE}" | awk '/Digest:/ {print $2; exit}')"
          if [[ -z "${BASE_DIGEST}" ]]; then
            echo "Failed to determine base image digest" >&2
            exit 1
          fi
          BASE_TAG="base-${BASE_DIGEST//[:]/-}"

          SHOULD_BUILD="true"
          if [[ "${EVENT_NAME}" == "schedule" ]]; then
            if docker manifest inspect "${IMAGE_NAME}:${BASE_TAG}" >/dev/null 2>&1; then
              SHOULD_BUILD="false"
            fi
          fi

          echo "Base image digest: ${BASE_DIGEST}"
          echo "should_build=${SHOULD_BUILD}" >> "${GITHUB_OUTPUT}"
          echo "base_tag=${BASE_TAG}" >> "${GITHUB_OUTPUT}"

  build-and-push:
    needs: guard
    if: needs.guard.outputs.should_build == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout develop (or triggering ref)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref || 'refs/heads/develop' }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=1.0.0
            type=sha,format=long
            type=raw,value=${{ needs.guard.outputs.base_tag }},enable=${{ needs.guard.outputs.base_tag != '' }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ env.DOCKERFILE_PATH }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            TZ=UTC
